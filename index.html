<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy to Heart</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        canvas { position: absolute; top: 0; left: 0; display: block; }
        #heartCanvas { opacity: 0; transition: opacity 2s ease-in; }
    </style>
</head>
<body>
    <div id="galaxy-container"></div>
    <canvas id="heartCanvas"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('galaxy-container').appendChild(renderer.domElement);
        const starGeometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(15000 * 3);
        for(let i=0; i < 45000; i++) posArray[i] = (Math.random() - 0.5) * 10;
        starGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ size: 0.005, color: 0xff6030 }));
        scene.add(stars);
        camera.position.z = 2;
        function animateG() { requestAnimationFrame(animateG); stars.rotation.y += 0.002; renderer.render(scene, camera); }
        animateG();

        const heartCanvas = document.getElementById('heartCanvas');
        const hCtx = heartCanvas.getContext('2d');
        heartCanvas.width = window.innerWidth; heartCanvas.height = window.innerHeight;
        const particles = [];
        function getHeartPoint(t) { return { x: 16 * Math.pow(Math.sin(t), 3), y: -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) }; }
        class Particle {
            constructor() {
                this.t = Math.random() * Math.PI * 2;
                const pt = getHeartPoint(this.t);
                this.targetX = pt.x * 12 + heartCanvas.width/2; this.targetY = pt.y * 12 + heartCanvas.height/2;
                this.x = Math.random() * heartCanvas.width; this.y = Math.random() * heartCanvas.height;
                this.speed = Math.random() * 0.03 + 0.01;
            }
            update() { this.x += (this.targetX - this.x) * this.speed; this.y += (this.targetY - this.y) * this.speed; }
            draw() { hCtx.fillStyle = "#ff2d55"; hCtx.beginPath(); hCtx.arc(this.x, this.y, 1.5, 0, Math.PI*2); hCtx.fill(); }
        }
        for(let i=0; i<600; i++) particles.push(new Particle());
        function animateH() { hCtx.fillStyle = "rgba(0,0,0,0.1)"; hCtx.fillRect(0,0,heartCanvas.width,heartCanvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateH); }
        setTimeout(() => { heartCanvas.style.opacity = "1"; animateH(); }, 3000);
    </script>
</body>
</html>
